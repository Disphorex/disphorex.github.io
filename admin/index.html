<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="app-version" content="1.1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Pazar yönetimi</title>
<style>
:root{--bg:#100D0B;--card:#1B1511;--ink:#EADFC8;--mut:#A99A83;--line:#3D3128;--acc:#C9A45C;--acc-ink:#1A130D;--bad:#E07B6A;--ok:#8DBF8A;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root{--bg:#F6F1E7;--card:#FFFDF8;--ink:#2A2118;--mut:#6F6252;--line:#D9CDB8;--acc:#8A6A2A;--acc-ink:#fff;--bad:#B3402F;--ok:#3E7A3B;color-scheme:light}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.w{max-width:760px;margin:0 auto;padding:14px 14px 30px}
h1{font:italic 400 24px/1.2 Georgia,serif;margin:6px 0 4px}h2{font-size:17px;margin:18px 0 8px}
.m{color:var(--mut);font-size:14px;margin:4px 0 12px}.err{color:var(--bad)}.ok{color:var(--ok)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1*env(safe-area-inset-top,0px))}
.top b{font:italic 400 18px Georgia,serif}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 0}
input,textarea,select{width:100%;margin-top:4px;padding:11px 12px;font:16px inherit;font-family:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px}
textarea{min-height:90px;resize:vertical}input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
.b{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;border-radius:6px;font:600 14px inherit;font-family:inherit;cursor:pointer;min-height:44px}
.b.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.b.d{color:var(--bad)}.b.s{padding:8px 12px;min-height:36px;font-size:13px}
.row{display:flex;width:100%;justify-content:space-between;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 8px;color:var(--ink);font:inherit;cursor:pointer}
.row small{display:block;color:var(--mut);font-size:13px;margin-top:2px}.row .r{white-space:nowrap;text-align:right}
.row.nw{background:transparent;border-style:dashed;justify-content:center;color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:12px 0}summary{cursor:pointer;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--acc);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:space-between}
.bar span{font-size:14px}.bar div{display:flex;gap:8px}
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.acts .b{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;display:none;max-width:90%}
ol{padding-left:20px;margin:8px 0}li{margin:4px 0}
/* Wix sekmesi */
#wix{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column}
#wix[hidden]{display:none}
.wxtop,.wxbot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);padding:8px 12px}
.wxtop{border-bottom:1px solid var(--line);padding-top:calc(8px + env(safe-area-inset-top,0px))}
.wxbot{border-top:1px solid var(--acc);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-between}
.wxtop .sp{flex:1}.wxinfo,.wxbot span{font-size:13px;color:var(--mut)}
.wxstage{flex:1;min-height:0;display:flex;justify-content:center;background:#050403;overflow:hidden}
#wxf{border:0;width:100%;height:100%;background:#fff}
#wix.mob #wxf{width:390px;max-width:100%}
.ov{z-index:60}
</style>
<style id="app-version-style">.app-version{display:block;position:static;margin:14px 12px 8px auto;width:max-content;color:#526056;background:rgba(255,255,255,.82);border:1px solid rgba(95,112,100,.28);border-radius:12px;padding:2px 7px;font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}</style>
</head><body>
<div id="app"></div><div id="toast"></div>
<div id="wix" hidden>
 <div class="wxtop"><button class="b s" data-a="wxback">← Satıcılar</button><b style="font:italic 400 18px Georgia,serif">Wix</b>
  <button class="b s" id="wxmode" data-a="wxmode">Düzenleme: açık</button><button class="b s" data-a="wxdev">Mobil / Masaüstü</button><button class="b s" data-a="wxreload">Yenile</button><button class="b s" data-a="wxcfg" title="Parfümeri paneli adresi">⚙</button>
  <span class="sp"></span><span class="wxinfo" id="wxinfo"></span></div>
 <div class="wxstage"><iframe id="wxf" title="Parfümeri canlı önizleme"></iframe></div>
 <div class="wxbot"><span id="wxcount">Değişiklik yok</span><div style="display:flex;gap:8px"><button class="b s" id="wxdis" data-a="wxdis">Vazgeç</button><button class="b p" id="wxsave" data-a="save">Değişiklikleri Kaydet</button></div></div>
</div>
<script>
(function(){
"use strict";
/* PRODUCT_MASTER_V2_ADMIN: master IDs and metadata are loaded/saved with seller records. */
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var LS={g:function(k){try{return localStorage.getItem(k)}catch(e){return null}},s:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},d:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function guess(){
  var c={owner:'',repo:'',branch:'',dir:'parfumeri/data'},h=location.hostname,p=location.pathname.split('/').filter(Boolean);
  if(/\.github\.io$/.test(h)){c.owner=h.split('.')[0];c.repo=(p[0]&&p[0]!=='admin')?p[0]:c.owner+'.github.io';}
  return c;
}
var cfg=guess();try{var sv=JSON.parse(LS.g('op_adm_cfg')||'{}');for(var k in sv)if(sv[k])cfg[k]=sv[k];}catch(e){}
var tok=LS.g('op_adm_tok')||'';
var S={view:tok?'list':'login',sellers:[],man:{date:'',files:[]},productsData:null,productsFile:'products.json',productsDirty:false,head:'',gone:[],dirty:false,cur:null,q:'',iq:'',lim:60,msg:'',setDate:true,busy:false};
var PRODUCT_BY_ID={};
function runtimeProductItem(p){if(Array.isArray(p))return ni(p);var m=PRODUCT_BY_ID[String(p.product_id)]||{},a=[m.name||('Ürün #'+p.product_id),p.price??null,p.old_price??null,p.volume_ml??null,p.url||'',p.stock||'',p.options||'',p.seller_name||'',p.legacy_category||m.gender||'',Array.isArray(p.volume_prices)?p.volume_prices.map(function(v){return [v.volume_ml,v.price,v.old_price||null,v.label||'']}):[]];a._productId=p.product_id;a._sellerName=p.seller_name||'';return a}
function ensureProductId(p){if(p._productId&&PRODUCT_BY_ID[String(p._productId)])return p._productId;var found=(S.productsData.products||[]).filter(function(x){return x.name===String(p[0]||'')})[0];if(found){p._productId=found.id;return found.id}var id=(S.productsData.products||[]).reduce(function(m,x){return Math.max(m,+x.id||0)},0)+1,prod={id:id,name:String(p[0]||''),brand:'',variant:'',gender:['Kadın','Erkek','Unisex'].indexOf(p[8])>=0?p[8]:'',season:'',time:'',category:'',aliases:[],legacy_categories:p[8]?[p[8]]:[],review_status:'metadata_incomplete'};S.productsData.products.push(prod);PRODUCT_BY_ID[String(id)]=prod;S.productsDirty=true;return p._productId=id}
var dl=['Erkek','Kadın','Unisex','Kadın + Erkek','Deneme seti'];

/* ---------- GitHub ---------- */
function api(path,o){o=o||{};
  return fetch('https://api.github.com'+path,{method:o.method||'GET',cache:'no-store',
    headers:Object.assign({Authorization:'Bearer '+tok,Accept:o.raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},o.body?{'Content-Type':'application/json'}:{}),
    body:o.body?JSON.stringify(o.body):undefined}).then(function(r){
      if(!r.ok){var e=new Error('GitHub '+r.status+({401:' — anahtar geçersiz veya süresi dolmuş',403:' — bu depoya yazma yetkisi yok',404:' — bulunamadı (depo adı, dal veya klasör yolu yanlış olabilir)',409:' — çakışma, yenileyip tekrar dene',422:' — istek reddedildi'}[r.status]||''));e.status=r.status;throw e;}
      return o.raw?r.text():r.json();});
}
var rp=function(p){return '/repos/'+cfg.owner+'/'+cfg.repo+p};
function readFile(n){return api(rp('/contents/'+cfg.dir+'/'+n+'?ref='+encodeURIComponent(cfg.branch)),{raw:true}).then(JSON.parse)}
function ni(p){var d=['',null,null,null,'','','','',''];for(var i=0;i<p.length;i++)if(p[i]!==undefined&&p[i]!==null)d[i]=p[i];return d}
function nk(p){return String(p[0]||'').toLowerCase()+'|'+(p[3]||'')}
function merge(t,a){(a.items||[]).forEach(function(raw){var p=ni(raw);if(raw._productId)p._productId=raw._productId;var k=nk(p),i=-1;t.items.forEach(function(q,j){if(i<0&&nk(q)===k)i=j});if(i>=0)t.items[i]=p;else t.items.push(p)});['note','sizes','policy','shipping','campaigns'].forEach(function(f){if(a[f])t[f]=a[f]})}
function load(){
  S.msg='Veriler okunuyor…';render();
  var b=cfg.branch?Promise.resolve():api(rp('')).then(function(r){cfg.branch=r.default_branch});
  return b.then(function(){return api(rp('/git/ref/heads/'+encodeURIComponent(cfg.branch)))}).then(function(r){S.head=r.object.sha;return readFile('index.json').catch(function(e){
      if(e.status===404&&cfg.dir.indexOf('docs/')!==0){cfg.dir='docs/'+cfg.dir;return readFile('index.json');}throw e;})})
  .then(function(m){S.man=m;S.productsFile=m.productsFile||'products.json';return (m.productsFile?readFile(m.productsFile):Promise.resolve(null)).catch(function(e){if(e.status===404)return null;throw e}).then(function(cat){S.productsData=cat||{schema_version:1,products:[]};PRODUCT_BY_ID={};(S.productsData.products||[]).forEach(function(x){PRODUCT_BY_ID[String(x.id)]=x});return Promise.all(m.files.map(readFile))}).then(function(list){
      S.sellers=[];list.forEach(function(d,i){var f=m.files[i];
        d.items=(d.items||[]).map(runtimeProductItem);
        if(d.append){var t=S.sellers.filter(function(x){return x.data.base===d.base&&(x.data.name||'')===(d.name||'')})[0];if(t){merge(t.data,d);t.extra.push(f);return;}}
        S.sellers.push({file:f,extra:[],data:d,dirty:false});});
      S.gone=[];S.dirty=false;S.productsDirty=false;S.msg='';LS.s('op_adm_cfg',JSON.stringify(cfg));
      if(S.view==='login')S.view='list';render();if(S.view==='wix')wxRelink();});})
  .catch(function(e){S.msg='Hata: '+e.message;if(S.view!=='login'&&e.status===401){S.view='login';}render();});
}

/* ---------- yardımcılar ---------- */
function pp(v){v=String(v||'').trim();if(!v)return null;var t=v.replace(/\s|TL|₺/gi,'');
  if(/^[\d.,]+$/.test(t)){if(t.indexOf(',')>=0)t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');var n=parseFloat(t);if(!isNaN(n))return n;}
  return v}
var nf=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2});
var fp=function(v){return v==null||v===''?'':typeof v==='number'?nf.format(v):String(v)};
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}}
function sname(s){return s.data.name||host(s.data.base)||'(adsız)'}
function slug(n){return n.toLowerCase().replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'satici'}
function ser(d){if(d.schema_version===2){var out=Object.assign({},d);out.items=d.items.map(function(p){return {product_id:ensureProductId(p),price:p[1]??null,old_price:p[2]??null,volume_ml:p[3]??null,url:p[4]||'',stock:p[5]||null,options:p[6]||null,seller_name:p[7]||null,legacy_category:p[8]||null,volume_prices:Array.isArray(p[9])?p[9].map(function(v){return {volume_ml:v[0],price:v[1],old_price:v[2]||null,label:v[3]||''}}):[]}});return JSON.stringify(out,null,2)+'\n'}var h=['"base": '+JSON.stringify(d.base||'')],sk={base:1,items:1,append:1,name:1,note:1,sizes:1,policy:1};['name','note','sizes','policy'].forEach(function(k){if(d[k]!==undefined&&d[k]!=='')h.push(JSON.stringify(k)+': '+JSON.stringify(d[k]))});Object.keys(d).forEach(function(k){if(sk[k]||d[k]==null||d[k]===''||(Array.isArray(d[k])&&!d[k].length))return;h.push(JSON.stringify(k)+': '+JSON.stringify(d[k]))});
  var its=d.items.map(function(p){var a=p.slice();while(a.length>5&&(a[a.length-1]===''||a[a.length-1]===null))a.pop();return JSON.stringify(a)});
  return '{\n'+h.join(',\n')+',\n"items": [\n'+its.join(',\n')+'\n]\n}\n'}
function mark(){S.dirty=true;if(S.cur!==null)S.sellers[S.cur].dirty=true;var b=$('#savebar');if(b)b.outerHTML=bar()}
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},2600)}
function bar(){return S.dirty?'<div class="bar" id="savebar"><span>Kaydedilmemiş değişiklik var</span><div><button class="b s" data-a="discard">Vazgeç</button><button class="b p" data-a="save">'+(S.busy?'Kaydediliyor…':'GitHub\'a kaydet')+'</button></div></div>':'<span id="savebar"></span>'}

/* ---------- görünümler ---------- */
function render(){if(S.view==='wix'){wxShow();return}wxHide();var h;
  if(S.view==='login')h=vLogin();else if(S.view==='seller')h=vSeller();else h=vList();
  $('#app').innerHTML=h+bar();if(S.view==='seller')items();}
function vLogin(){return '<main class="w"><h1>Pazar yönetimi</h1><p class="m">Satıcıları ve ürün kartlarını buradan düzenleyip doğrudan GitHub deposuna kaydedebilirsin.</p>'+
  '<label>GitHub erişim anahtarı (token)<input id="tok" type="password" autocomplete="off" placeholder="github_pat_…" value="'+esc(tok)+'"></label>'+
  '<details><summary>Depo ayarları (genelde dokunma)</summary><label>Kullanıcı adı<input id="c-owner" value="'+esc(cfg.owner)+'"></label><label>Depo adı<input id="c-repo" value="'+esc(cfg.repo)+'"></label><label>Dal (boşsa otomatik)<input id="c-branch" value="'+esc(cfg.branch)+'"></label><label>Veri klasörü<input id="c-dir" value="'+esc(cfg.dir)+'"></label></details>'+
  '<div class="acts"><button class="b p" data-a="login">Giriş yap</button></div><p class="'+(S.msg.indexOf('Hata')===0?'err':'m')+'">'+esc(S.msg)+'</p>'+
  '<details><summary>Anahtarı nasıl alırım?</summary><ol><li>GitHub → profil resmin → <b>Settings</b></li><li><b>Developer settings → Personal access tokens → Fine-grained tokens → Generate new token</b></li><li><b>Repository access:</b> Only select repositories → sitenin deposunu seç</li><li><b>Permissions → Repository permissions → Contents: Read and write</b></li><li>Bitiş tarihi koy (ör. 90 gün), oluştur, anahtarı kopyalayıp buraya yapıştır</li></ol><p class="m">Anahtar yalnızca bu cihazın tarayıcısında saklanır. Kimseyle paylaşma.</p></details></main>'}
function vList(){var q=S.q.toLowerCase(),n=0;
  var rows=S.sellers.map(function(s,i){var t=sname(s);if(q&&t.toLowerCase().indexOf(q)<0)return '';n++;
    return '<button class="row" data-a="open" data-i="'+i+'"><span>'+esc(t)+'<small>'+esc(host(s.data.base)||'site adresi yok')+'</small></span><span class="r">'+s.data.items.length+' ürün'+(s.dirty?'<small class="ok">değişti</small>':'')+'</span></button>'}).join('');
  return '<div class="top"><span><b>Pazar</b> · <a href="olfactus.html" style="color:var(--acc);text-decoration:none">Olfactus →</a> · <a href="../parfum-veri-editoru.html" style="color:var(--acc);text-decoration:none">Veri editörü ↗</a> · <a href="metadata-ai.html" style="color:var(--acc);text-decoration:none">AI metadata ↗</a> · <a href="price-tool.html" style="color:var(--acc);text-decoration:none">Fiyat aracı ↗</a></span><span><button class="b s" data-a="wix">Wix · canlı düzenleme</button> <button class="b s" data-a="reload">Yenile</button> <button class="b s" data-a="logout">Çıkış</button></span></div><main class="w">'+
  (S.msg?'<p class="'+(S.msg.indexOf('Hata')===0?'err':'m')+'">'+esc(S.msg)+'</p>':'')+
  '<label>Satıcı ara<input id="sq" value="'+esc(S.q)+'" placeholder="satıcı adı"></label><h2>Satıcılar ('+S.sellers.length+')</h2>'+rows+
  '<button class="row nw" data-a="newseller">+ Satıcı ekle</button>'+
  '<label style="display:flex;gap:8px;align-items:center;margin-top:18px"><input type="checkbox" id="sd" style="width:auto;margin:0"'+(S.setDate?' checked':'')+'> Kaydederken Pazar tarihini bugüne güncelle</label></main>'}
function vSeller(){var s=S.sellers[S.cur],d=s.data;
  return '<div class="top"><button class="b s" data-a="back">← Satıcılar</button><b>'+esc(sname(s))+'</b><button class="b s" data-a="wixs">Canlıda gör</button></div><main class="w">'+
  '<h2>Satıcı bilgileri</h2><label>Satıcı adı (kartlarda bu görünür)<input data-f="name" value="'+esc(d.name||'')+'"></label>'+
  '<label>Site adresi (ürün yolları buna eklenir)<input data-f="base" value="'+esc(d.base||'')+'" placeholder="https://ornek.com"></label>'+
  '<label>Hacim seçenekleri<input data-f="sizes" value="'+esc(d.sizes||'')+'"></label><label>Kampanya / fiyat politikası<input data-f="policy" value="'+esc(d.policy||'')+'"></label>'+
  '<label>Not (satıcı kutusunda görünür)<textarea data-f="note">'+esc(d.note||'')+'</textarea></label>'+
  '<h2>Ürünler (<span id="cnt"></span>)</h2><input id="iq" placeholder="ürün ara" value="'+esc(S.iq)+'"><div style="height:10px"></div><div id="items"></div>'+
  '<div class="acts"><button class="b" data-a="bulk">Toplu ekle</button><button class="b d" data-a="delseller">Satıcıyı sil</button></div></main>'}
function items(){if(!$('#items'))return;var s=S.sellers[S.cur],q=S.iq.toLowerCase(),out=[],n=0;
  s.data.items.forEach(function(p,i){if(q&&String(p[0]).toLowerCase().indexOf(q)<0)return;n++;if(out.length>=S.lim)return;
    var info=[p[3]?p[3]+' ml':'',p[8]||'',p[6]?'seçenekler: '+p[6]:''].filter(Boolean).join(' · ');
    out.push('<button class="row" data-a="edit" data-i="'+i+'"><span>'+esc(p[0])+'<small>'+esc(info||'—')+'</small></span><span class="r">'+(p[1]==null?'<small>fiyat yok</small>':esc(fp(p[1]))+(typeof p[1]==='number'?' TL':''))+(p[2]?'<small><s>'+esc(fp(p[2]))+'</s></small>':'')+'</span></button>')});
  $('#items').innerHTML='<button class="row nw" data-a="newitem">+ Ürün ekle</button>'+out.join('')+(n>out.length?'<button class="row nw" data-a="more">Daha fazla göster ('+(n-out.length)+')</button>':'')+(n===0?'<p class="m">Eşleşen ürün yok.</p>':'');
  $('#cnt').textContent=q?n+' / '+s.data.items.length:s.data.items.length}

/* ---------- pencereler ---------- */
function modal(h){var o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML='<div class="sheet">'+h+'</div>';document.body.appendChild(o);o.addEventListener('mousedown',function(e){if(e.target===o)closeM()})}
function closeM(){var o=$('#ov');if(o)o.remove()}
function f(id,l,v,extra){return '<label>'+l+'<input id="'+id+'" value="'+esc(v)+'" '+(extra||'')+'></label>'}
function itemForm(idx){var p=idx>=0?S.sellers[S.cur].data.items[idx]:ni(['']);
